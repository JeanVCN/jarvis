[project]
name = "jarvis-voice-agent"
version = "0.1.0"
description = "Realtime voice-agent boundary for Jarvis."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
realtime = [
  "pipecat-ai>=0.0.90",
  "livekit>=0.18.0",
]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
jarvis-voice-agent = "jarvis_voice_agent.server:main"
jarvis-voice-console = "jarvis_voice_agent.console:main"
jarvis-voice-realtime = "jarvis_voice_agent.realtime:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
